[project]
name = "python-universal-review-stress-fixture"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "aiohttp",
  "django",
  "flask",
  "pyyaml",
  "sqlalchemy",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
